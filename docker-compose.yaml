services:
  veyra:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - APP_URL=${APP_URL}
      - TELEGRAM_CLIENT_ID=${TELEGRAM_CLIENT_ID}
      - TELEGRAM_CLIENT_SECRET=${TELEGRAM_CLIENT_SECRET}
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXUS_CORE_URL=${NEXUS_CORE_URL:-http://core-api:3000}
      - CORE_API_KEY=${CORE_API_KEY:-}
    networks:
      - veyra-network

networks:
  veyra-network:
    external: true
